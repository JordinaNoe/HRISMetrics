services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrismetrics
      POSTGRES_PASSWORD: hrismetrics
      POSTGRES_DB: hrismetrics
    ports:
      - "5432:5432"
    volumes:
      - hrismetrics-db-data:/var/lib/postgresql/data

volumes:
  hrismetrics-db-data:
